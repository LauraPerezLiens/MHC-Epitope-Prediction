name: CPU checks

on:
  push:
    branches: [main, check_github_structure]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: env/requirements-ci.txt
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd
          python -m pip install pip==26.0.1
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r env/requirements-ci.txt
          python -m pip check
      - name: Syntax and basic correctness
        run: |
          python -m compileall -q data_pipeline neural_network examples tests
          bash -n neural_network/MLP/run_shuffled_pipeline.sh
          bash -n neural_network/MLP/run_chunk_ladder100_dualeval.sh
          python -m ruff check --no-cache .
      - name: CPU regression tests
        run: python -m unittest discover -s tests -t . -v
      - name: Synthetic inference example
        run: python examples/synthetic_mlp.py
